services:
  - type: web
    name: ragbot-api
    runtime: python
    region: oregon           # Change to "frankfurt" or "singapore" if closer to users
    plan: free               # Upgrade to "starter" for persistent disk & no cold starts

    # Working directory is the repo root; source is the backend folder
    rootDir: backend

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: GROQ_API_KEY
        sync: false          # Set manually in Render dashboard → Environment

      - key: GROQ_MODEL
        value: llama3-8b-8192

      - key: GOOGLE_CREDENTIALS_PATH
        value: google-credentials.json

      - key: GOOGLE_SHEET_NAME
        value: RAG Chatbot Leads

      - key: EMAIL_SENDER
        sync: false

      - key: EMAIL_PASSWORD
        sync: false

      - key: EMAIL_RECIPIENT
        sync: false

      - key: MAX_FILE_SIZE_MB
        value: "10"

      - key: CHUNK_SIZE
        value: "500"

      - key: CHUNK_OVERLAP
        value: "50"

      - key: TOP_K_RESULTS
        value: "3"

      - key: CORS_ORIGIN
        value: "*"           # Replace with your actual frontend URL in production

      - key: ENV
        value: production

    # Persist ChromaDB vector store across deploys (requires paid plan)
    # disk:
    #   name: vectorstore
    #   mountPath: /opt/render/project/src/vectorstore
    #   sizeGB: 1
